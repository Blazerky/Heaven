<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>БУРМАЛДА</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    .title {
      position: fixed;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(48px, 10vw, 110px);
      font-weight: 900;
      color: #cc0000;
      -webkit-text-stroke: 3px #ff0000;
      text-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff2200,
        0 0 50px #ff0000,
        -4px -4px 0 #ff1100,
         4px -4px 0 #ff1100,
        -4px  4px 0 #ff1100,
         4px  4px 0 #ff1100;
      letter-spacing: 8px;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    .photo {
      position: fixed;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.12);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <span class="title" id="title">БУРМАЛДА</span>

  <script>
    const titleEl = document.getElementById('title');
    const imgSrc = 'img/channels4_profile (2).jpg';
    const COUNT = 22;
    function rand(min, max) { return Math.random() * (max - min) + min; }

    let angle = 0;
    function spin() {
      angle += 1.2;
      titleEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
      requestAnimationFrame(spin);
    }
    spin();

    function animatePhoto(img) {
      const W = window.innerWidth, H = window.innerHeight;
      const size = parseFloat(img.style.width);
      const startX = rand(-size, W);
      const speed = rand(2.5, 6), rotSpeed = rand(-4, 4);
      const swayAmp = rand(15, 55), swayFreq = rand(0.012, 0.035);
      let y = -size - 20, rot = rand(0, 360), tick = rand(0, 200), opacity = 0;
      img.style.left = startX + 'px';
      img.style.top = (-size - 20) + 'px';
      img.style.opacity = 0;
      function step() {
        y += speed; tick++; rot += rotSpeed;
        const x = startX + Math.sin(tick * swayFreq) * swayAmp;
        if (opacity < 1) opacity = Math.min(1, opacity + 0.04);
        img.style.top = y + 'px'; img.style.left = x + 'px';
        img.style.opacity = opacity;
        img.style.transform = `rotate(${rot}deg)`;
        if (y < H + size + 20) requestAnimationFrame(step);
        else { img.style.opacity = 0; setTimeout(() => animatePhoto(img), rand(0, 1500)); }
      }
      requestAnimationFrame(step);
    }

    for (let i = 0; i < COUNT; i++) {
      const img = document.createElement('img');
      img.src = imgSrc; img.className = 'photo';
      const size = rand(65, 120);
      img.style.width = size + 'px'; img.style.height = size + 'px';
      document.body.appendChild(img);
      setTimeout(() => animatePhoto(img), i * rand(80, 350));
    }
  </script>
</body>
</html>
