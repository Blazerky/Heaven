<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ухади от сюда</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .spin {
    color: red;
    font-size: 8vw;
    font-weight: 900;
    white-space: nowrap;
    text-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
    animation: spin 2s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="spin">пошел нахуй</div>
</body>
</html>
